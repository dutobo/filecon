[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "filecon"
version = "0.3.1"
description = "File-type icons for 703 formats in nine styles (SVG) plus a file-type resolver."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "dutobo" }]
keywords = ["icons", "svg", "file-type", "file-icons", "mime", "filecon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://filecon.dev"
Repository = "https://github.com/dutobo/filecon"
Source = "https://github.com/dutobo/filecon/tree/main/ports/python"
Issues = "https://github.com/dutobo/filecon/issues"

# The SVGs, _names.py, _reference_resolve.py, LICENSE, NOTICE and tests/data are generated by `pnpm codegen` and
# gitignored; `ignore-vcs` makes hatchling package them anyway.
[tool.hatch.build]
ignore-vcs = true
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/filecon"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
