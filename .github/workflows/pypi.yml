name: PyPI

# Publishes ports/python to PyPI with Trusted Publishing (OpenID Connect): no token, PyPI trusts this workflow.
# PyPI publisher settings: project "filecon", owner "dutobo", repository "filecon", workflow "pypi.yml",
# environment "pypi". Runs on a tag python-v<version> (must match ports/python/pyproject.toml) or manually.
on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - name: Codegen (icons and generated modules of the Python package)
        run: pnpm codegen
      - name: Check the tag against the package version
        if: startsWith(github.ref, 'refs/tags/python-v')
        working-directory: ports/python
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          test "python-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Test and build
        working-directory: ports/python
        run: |
          python -m pip install build twine pytest
          python -m pytest
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: ports/python/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/filecon/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
