name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/filecon
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Scaffolded files are up to date
        run: git diff --exit-code -- packages tools
      - name: Test (JS, tarballs, Rust)
        run: pnpm test
      - name: Rust lint
        run: pnpm lint:rust
      - name: Rust feature matrix
        run: |
          for feature in style-default style-gray style-solid; do
            cargo test --manifest-path crates/filecon/Cargo.toml --no-default-features --features "$feature"
          done
      - name: Crate packages
        run: cargo package --manifest-path crates/filecon/Cargo.toml --allow-dirty --no-verify
