name: Release

# Manual only. Defaults to a dry run. A real npm publish needs dry_run=false and the NPM_TOKEN secret
# (npm automation/granular token with publish rights for the @filecon scope). Provenance is generated by npm
# from this workflow run (id-token: write).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (npm publish --dry-run, nothing is uploaded)"
        type: boolean
        default: true
      publish_crate:
        description: "Also publish the Rust crate to crates.io (needs CARGO_REGISTRY_TOKEN)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      # pnpm pack resolves workspace: ranges and applies publishConfig.exports; npm publishes the tarballs
      # (npm generates the provenance statement).
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          pnpm -r --filter "./packages/**" exec pnpm pack --pack-destination "$RUNNER_TEMP/tarballs"
          ls -1 "$RUNNER_TEMP/tarballs"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          for tarball in "$RUNNER_TEMP"/tarballs/*.tgz; do
            manifest=$(tar -xOzf "$tarball" package/package.json)
            name=$(node -p "JSON.parse(process.argv[1]).name" "$manifest")
            version=$(node -p "JSON.parse(process.argv[1]).version" "$manifest")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              npm publish "$tarball" --access public --dry-run
            else
              npm publish "$tarball" --access public --provenance
            fi
          done

      - name: Publish crate (dry run)
        if: ${{ inputs.publish_crate && inputs.dry_run }}
        run: cargo publish --manifest-path crates/filecon/Cargo.toml --dry-run
      - name: Publish crate
        if: ${{ inputs.publish_crate && !inputs.dry_run }}
        run: cargo publish --manifest-path crates/filecon/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
