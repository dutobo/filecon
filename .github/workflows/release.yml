name: Release

# Manual only. Defaults to a dry run; a real publish needs dry_run=false and the NPM_TOKEN secret.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (npm publish --dry-run, nothing is uploaded)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: pnpm -r publish --dry-run --no-git-checks --access public
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: pnpm -r publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish crate (dry run)
        if: ${{ inputs.dry_run }}
        run: cargo publish --manifest-path crates/filecon/Cargo.toml --dry-run
      - name: Publish crate
        if: ${{ !inputs.dry_run }}
        run: cargo publish --manifest-path crates/filecon/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
